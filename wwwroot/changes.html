<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changed records – Research Form ETL</title>
<script>
  (function () { var t = null; try { t = localStorage.getItem("etl-theme"); } catch (e) { }
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
  :root, [data-theme="light"] { color-scheme:light;
    --color-accent:#217346; --color-accent-hover:#185c38; --color-accent-soft:#e8f3ec; --color-on-accent:#ffffff;
    --color-page:#f4f7f5; --color-surface:#ffffff; --color-surface-muted:#f7f9f8;
    --color-text:#24312a; --color-text-muted:#5f6e65; --color-border:#dce4de; --color-border-strong:#c5d1c8;
    --color-success:#107c41; --color-success-soft:#e7f4eb; --color-warning:#a96808; --color-warning-soft:#fff4df;
    --color-danger:#c43132; --color-danger-soft:#fceaea; --color-grid-line:#e5ebe7; --color-grid-header:#f1f5f2; --color-row-hover:#f3f8f5;
    --shadow-panel:0 1px 2px rgb(20 40 28 / 6%); --focus-ring:0 0 0 3px rgb(33 115 70 / 22%); }
  [data-theme="dark"] { color-scheme:dark;
    --color-accent:#55a875; --color-accent-hover:#70bd8e; --color-accent-soft:#20392b; --color-on-accent:#0f1712;
    --color-page:#151a17; --color-surface:#1d2420; --color-surface-muted:#202822;
    --color-text:#e8eee9; --color-text-muted:#a3b0a7; --color-border:#354239; --color-border-strong:#46564b;
    --color-success:#65c18a; --color-success-soft:#20392b; --color-warning:#e6b65c; --color-warning-soft:#40331d;
    --color-danger:#ef7777; --color-danger-soft:#432526; --color-grid-line:#354239; --color-grid-header:#28332c; --color-row-hover:#26302a;
    --shadow-panel:0 1px 2px rgb(0 0 0 / 22%); --focus-ring:0 0 0 3px rgb(85 168 117 / 28%); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--color-page); color:var(--color-text);
         font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif; }
  :focus-visible { outline:none; box-shadow:var(--focus-ring); border-color:var(--color-accent) !important; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  .appbar { height:56px; display:flex; align-items:center; gap:14px; padding:0 20px; background:var(--color-surface); border-bottom:1px solid var(--color-border); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; }
  .logo { width:28px; height:28px; border-radius:6px; background:var(--color-accent); color:var(--color-on-accent); display:grid; place-items:center; font-weight:700; font-size:13px; }
  .spacer { flex:1; }
  .themebtn { width:34px; height:34px; padding:0; display:grid; place-items:center; }
  .themebtn svg { width:16px; height:16px; } .themebtn .moon { display:none; }
  [data-theme="dark"] .themebtn .sun { display:none; } [data-theme="dark"] .themebtn .moon { display:block; }
  main { max-width:1680px; margin:0 auto; padding:16px 20px 64px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:var(--color-text-muted); margin:0 0 14px; font-size:13px; }
  a { color:var(--color-accent); }
  .card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:10px; padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-panel); }
  .summary { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { height:30px; border:1px solid var(--color-border-strong); border-radius:999px; padding:0 12px; cursor:pointer; background:var(--color-surface); font:inherit; font-size:13px; color:var(--color-text); }
  .chip:hover { border-color:var(--color-accent); }
  .chip.on { border-color:var(--color-accent); background:var(--color-accent); color:var(--color-on-accent); }
  .chip b { margin-left:6px; }
  .tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  input[type=search] { height:36px; padding:0 10px; border:1px solid var(--color-border-strong); border-radius:6px; background:var(--color-surface); color:var(--color-text); font:inherit; min-width:280px; }
  .muted { color:var(--color-text-muted); font-size:13px; }
  .grid { overflow:auto; max-height:70vh; border:1px solid var(--color-border); border-radius:8px; }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--color-grid-line); border-right:1px solid var(--color-grid-line); vertical-align:top; }
  th:last-child, td:last-child { border-right:0; }
  th { font-size:12px; font-weight:600; color:var(--color-text-muted); position:sticky; top:0; z-index:1; background:var(--color-grid-header); border-bottom-color:var(--color-border-strong); }
  tbody tr:hover td { background:var(--color-row-hover); }
  tr.first td { border-top:2px solid var(--color-border-strong); }
  td.val { max-width:420px; overflow-wrap:anywhere; }
  .old { background:var(--color-danger-soft); color:var(--color-danger); text-decoration:line-through; border-radius:4px; padding:1px 6px; }
  .new { background:var(--color-success-soft); color:var(--color-success); border-radius:4px; padding:1px 6px; font-weight:600; }
  .lbl { display:inline-block; font-size:11px; font-weight:600; color:var(--color-warning); background:var(--color-warning-soft); border-radius:4px; padding:0 6px; margin-left:6px; vertical-align:1px; }
  .empty { color:var(--color-text-muted); font-style:italic; }
  .arrow { color:var(--color-text-muted); padding:0 4px; }
  .err { color:var(--color-danger); }
  ul { margin:6px 0 0; padding-left:18px; color:var(--color-text-muted); font-size:13px; }
  .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; }
  button { height:34px; padding:0 14px; border-radius:6px; border:1px solid var(--color-border-strong); background:var(--color-surface); color:var(--color-text); cursor:pointer; font:inherit; }
  button:hover:not(:disabled) { border-color:var(--color-accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
<script src="auth.js?v=1"></script>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="logo" aria-hidden="true">X</span><span>Research Form ETL</span></div>
  <div class="spacer"></div>
  <button id="themeBtn" class="themebtn" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
<main>
  <p><a id="cleanupBack" href="cleanup.html">← Clean-up rules</a></p>
  <h1>Changed records</h1>
  <p class="sub" id="sub">Every cell the clean-up changed, shown as original → new.</p>

  <div id="msg" class="card" hidden role="status" aria-live="polite"></div>

  <section class="card" id="notesCard" hidden>
    <strong>What was changed</strong>
    <ul id="notes"></ul>
  </section>

  <section class="card" id="tableCard" hidden>
    <div class="summary" id="rules"></div>
    <div class="tools">
      <input id="q" type="search" aria-label="Search changes" placeholder="Search row, Id, column or value…">
      <span class="muted" id="count"></span>
    </div>
    <div class="grid">
      <table>
        <thead><tr><th scope="col">Excel row</th><th scope="col">Id</th><th scope="col">Rule</th><th scope="col">Field</th><th scope="col">Original value</th><th scope="col"><span class="sr-only">changed to</span></th><th scope="col">New value</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev">Previous</button>
      <span class="muted" id="page"></span>
      <button id="next">Next</button>
    </div>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const id = params.get("id"), file = params.get("file");
  const PAGE = 200;
  let all = [], rule = null, page = 0;

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function val(v, cls) { return v == null || v === "" ? el("span", "empty", "(empty)") : el("span", cls, v); }
  function show(text, isErr) { const m = $("msg"); m.hidden = false; m.textContent = text; m.classList.toggle("err", !!isErr); }

  function filtered() {
    const q = $("q").value.trim().toLowerCase();
    return all.filter(c => (!rule || c.rule === rule) &&
      (!q || [c.rowNumber, c.recordId, c.column, c.original, c.updated, c.rule].some(x => x != null && String(x).toLowerCase().includes(q))));
  }

  function renderRules() {
    const counts = {};
    // count records (rows), not cells, per rule
    const seen = new Set();
    all.forEach(c => { const k = c.rule + "|" + c.rowNumber; if (!seen.has(k)) { seen.add(k); counts[c.rule] = (counts[c.rule] || 0) + 1; } });
    const total = new Set(all.map(c => c.rowNumber)).size;
    const mk = (label, n, r) => {
      const b = el("button", "chip" + (rule === r ? " on" : ""), label);
      b.append(el("b", null, n.toLocaleString()));
      b.onclick = () => { rule = r; page = 0; renderRules(); render(); };
      return b;
    };
    $("rules").replaceChildren(mk("All records", total, null), ...Object.keys(counts).map(r => mk(r, counts[r], r)));
  }

  function render() {
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    page = Math.min(page, pages - 1);
    const slice = list.slice(page * PAGE, page * PAGE + PAGE);
    const rows = [];
    let prev = null;
    for (const c of slice) {
      const tr = el("tr", c.rowNumber !== prev ? "first" : null);
      const same = c.rowNumber === prev;
      tr.append(el("td", null, same ? "" : c.rowNumber), el("td", null, same ? "" : (c.recordId ?? "–")),
        el("td", "muted", c.rule), el("td", null, c.column));
      const o = el("td", "val"); o.append(val(c.original, "old"));
      const n = el("td", "val"); n.append(val(c.updated, "new"), el("span", "lbl", "Changed"));
      tr.append(o, el("td", "arrow", "→"), n);
      rows.push(tr);
      prev = c.rowNumber;
    }
    if (!rows.length) { const tr = el("tr"); const td = el("td", "empty", "No changes match."); td.colSpan = 7; tr.append(td); rows.push(tr); }
    $("body").replaceChildren(...rows);
    const recs = new Set(list.map(c => c.rowNumber)).size;
    $("count").textContent = `${recs.toLocaleString()} record(s), ${list.length.toLocaleString()} changed cell(s)`;
    $("page").textContent = `Page ${page + 1} of ${pages}`;
    $("prev").disabled = page === 0; $("next").disabled = page >= pages - 1;
  }

  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    const next = t === "dark" ? "light" : "dark";
    $("themeBtn").setAttribute("aria-label", `Switch to ${next} theme`); $("themeBtn").title = `Switch to ${next} theme`;
  }
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
  $("themeBtn").onclick = () => {
    const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try { localStorage.setItem("etl-theme", t); } catch { }
    applyTheme(t);
  };

  $("q").oninput = () => { page = 0; render(); };
  $("prev").onclick = () => { page--; render(); scrollTo(0, 0); };
  $("next").onclick = () => { page++; render(); scrollTo(0, 0); };

  (async () => {
    if (file) $("sub").textContent = `Every cell the clean-up changed in “${file}”, shown as original → new.`;
    if (id) $("cleanupBack").href = "cleanup.html" + location.search;
    if (!id) return show("No upload selected. Go back, upload a file, then open this page from “What was changed”.", true);
    try {
      const res = await fetch("/api/changes/" + encodeURIComponent(id));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return show(data.error || "Could not load the changes.", true);
      if (data.notes?.length) { $("notes").replaceChildren(...data.notes.map(n => el("li", null, n))); $("notesCard").hidden = false; }
      all = (data.changes || []).sort((a, b) => a.rowNumber - b.rowNumber);
      if (!all.length) return show((data.cleanup?.length ? "The applied clean-up rules did not change any value in this file." : "No clean-up rules are applied, so every value is as uploaded. Switch rules on from “Clean-up rules” in the ETL tab.")
        + " Calculated columns (Age, Is Sample Twin, hand ratios) are added to every row and are not listed here.");
      $("tableCard").hidden = false;
      renderRules(); render();
    } catch { show("Could not reach the server.", true); }
  })();
</script>
</body>
</html>
